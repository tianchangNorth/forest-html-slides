const slides = [{"id": "opening", "title": "AI Agent 概念演进", "chapter": "开场", "body": "\n<div class=\"hero-grid\"><div><div class=\"hero-name\">LESSON 00 / AI AGENT<\/div><h1>AI Agent<br>概念演进<\/h1><p class=\"hero-sub\">从对话界面，到能推进任务的系统<br>看懂工具、协议、技能与自主循环<\/p><div class=\"hero-mark\"><button class=\"action primary\" data-go=\"1\">开始第零课 ↗<\/button><span class=\"small\">18 页 · 约 20 分钟<\/span><\/div><p class=\"cover-bottom\">根据《第零课：AI Agent 概念演进》改编<\/p><\/div><div class=\"hero-diagram\"><div class=\"state-label\">A QUESTION<\/div><div class=\"hero-state\">“明天天气怎么样？”<\/div><div class=\"connector\"><\/div><div class=\"engine\"><strong>能调用工具<\/strong><span>TOOLS<br>CONTEXT<\/span><\/div><div class=\"connector\"><\/div><div class=\"state-label\">A GOAL<\/div><div class=\"hero-state\" style=\"border-top:0\">“找到这个 Bug，修复并验证。”<\/div><p class=\"tiny\" style=\"margin-top:22px\">任务的推进，来自模型与运行环境的配合。<\/p><\/div><\/div>", "lead": "", "notes": "本课沿用原文的问题驱动叙事：对话能力如何与工具、标准连接、程序性知识及反馈循环结合。展示的是理解系统的路径，不是所有技术严格依次发明或互相取代的历史。原文创建日期为 2026-06-17，本演示于 2026-10-09 依据官方资料校准了概念边界。", "refs": [], "foot": "第零课 · 理解 Agent 的组成与工作方式", "dark": true, "cover": true}, {"id": "questions", "title": "能力演进，围绕四个问题", "chapter": "全景", "body": "\n<div class=\"four-lanes\"><div class=\"lesson-lane\"><span class=\"label\">01 / ACTION<\/span><h3>怎样连接<br>外部行动？<\/h3><div class=\"lane-answer\">Function Calling<\/div><p>把模型的请求交给程序执行。<\/p><\/div><div class=\"lesson-lane\"><span class=\"label\">02 / CONNECTION<\/span><h3>怎样减少<br>重复对接？<\/h3><div class=\"lane-answer\">MCP<\/div><p>用通用协议连接不同服务。<\/p><\/div><div class=\"lesson-lane\"><span class=\"label\">03 / KNOW-HOW<\/span><h3>怎样复用<br>做事方法？<\/h3><div class=\"lane-answer\">Skills<\/div><p>按需加载说明、脚本与资源。<\/p><\/div><div class=\"lesson-lane\"><span class=\"label\">04 / FEEDBACK<\/span><h3>怎样持续<br>推进目标？<\/h3><div class=\"lane-answer\">Agent Loop<\/div><p>根据执行结果决定下一步。<\/p><\/div><\/div><p class=\"callout\" style=\"margin-top:40px\">这些能力可以组合。Agent 不必先拥有 MCP 或 Skills 才能成立。<\/p>", "lead": "先记住每个概念解决什么，再记名字。", "notes": "四个概念不处于同一个抽象层次。Function Calling 是模型请求工具的机制；MCP 是连接协议；Skill 提供任务知识与操作方法；Agent 是围绕目标运行的系统。原文按问题递进组织课程很适合入门，但不应把这种教学顺序当作技术依赖链。", "refs": ["agents", "skills"], "foot": "课程路线图，不是严格的发明顺序", "dark": false, "cover": false}, {"id": "chat", "title": "只有对话，缺少外部行动", "chapter": "起点", "body": "\n<div class=\"grid2\"><div class=\"split-lane\"><div class=\"dual-title\">USER / 用户<\/div><p class=\"quote\">“明天北京天气怎么样？”<\/p><div class=\"space\"><\/div><div class=\"dialogue-reply\"><span class=\"label\">WITHOUT A WEATHER TOOL<\/span><p>“我无法直接获取实时天气，<br>需要查询天气服务。”<\/p><\/div><\/div><div class=\"split-lane\"><h3>知识不等于外部访问权限<\/h3><div class=\"space\"><\/div><div class=\"flat-row\"><strong>能解释天气概念<\/strong><span>语言与知识能力<\/span><\/div><div class=\"flat-row\"><strong>能查询最新预报<\/strong><span>需要数据连接<\/span><\/div><div class=\"flat-row\"><strong>能读文件或发邮件<\/strong><span>需要工具与权限<\/span><\/div><p class=\"small\" style=\"margin-top:28px\">这里讨论的是没有外部工具的聊天场景。<br>AI 的历史与能力范围并不止于聊天。<\/p><\/div><\/div>", "lead": "2022 年底，ChatGPT 让对话式 AI 进入大众视野。", "notes": "原文用“被锁在房间里的天才”比喻没有外部工具的聊天模型。应把限制限定在当时的对话产品形态，而不是声称此前所有 AI 都只能聊天。模型生成流畅答案不代表拥有实时数据，更不等于已经执行了外部动作。天气对话为教学示例。", "refs": ["chatgpt"], "foot": "对话为教学示意，未查询实时天气", "dark": false, "cover": false}, {"id": "function", "title": "Function Calling：模型请求，程序执行", "chapter": "工具调用", "body": "\n<div class=\"step-strip\" data-fc-strip><\/div><div class=\"demo-stage\"><div><div class=\"label\" data-fc-owner><\/div><h3 data-fc-title class=\"demo-title\"><\/h3><p data-fc-description class=\"demo-description\"><\/p><p class=\"callout\" style=\"margin-top:24px\">模型给出工具名与参数。<br>真正的执行发生在应用程序中。<\/p><\/div><pre class=\"code demo-code\" data-fc-code><\/pre><\/div><div class=\"actions\" style=\"margin-top:23px\"><button class=\"action primary\" data-fc-next>下一步 →<\/button><button class=\"action\" data-fc-play>自动播放<\/button><button class=\"action\" data-fc-reset>重置<\/button><span class=\"tiny\" data-fc-count><\/span><\/div>", "lead": "从用户问题到最终回答，走一遍完整的工具调用回合。", "notes": "2023 年 6 月 13 日，OpenAI 公布了 Function Calling API 更新。这里按通用概念简化了请求字段，非某一 API 的完整请求格式。用户提问、模型请求工具、应用执行、结果返回、模型回答是可观察流程，不是模型的内部思维记录。执行方还应处理参数校验、权限和失败，不能把模型的请求直接等同于操作授权。", "refs": ["function"], "foot": "交互流程与天气数值均为教学模拟，未连接真实服务", "dark": false, "cover": false}, {"id": "mcp", "title": "MCP：为工具连接提供通用协议", "chapter": "标准连接", "body": "\n<div class=\"segmented\" data-mcp-tabs role=\"group\" aria-label=\"选择接入方式\"><button data-mode=\"custom\" class=\"active\" aria-pressed=\"true\">分别定制对接<\/button><button data-mode=\"standard\" aria-pressed=\"false\">通过 MCP 接入<\/button><\/div><div class=\"mcp-layout\"><div data-mcp-diagram class=\"connection-diagram\"><\/div><div class=\"vcenter\"><div class=\"label\" data-mcp-label><\/div><div class=\"number accent\" data-mcp-count><\/div><h3 data-mcp-summary style=\"margin-top:17px\"><\/h3><p class=\"small\" data-mcp-detail style=\"margin-top:19px\"><\/p><\/div><\/div><p class=\"callout\" style=\"margin-top:30px\">MCP 统一连接与交互方式。服务逻辑、身份授权和实际兼容性仍需实现。<\/p>", "lead": "像统一接口一样，减少每个应用为每个服务重复设计连接的工作。", "notes": "MCP 由 Anthropic 于 2024 年 11 月 25 日公开。常用类比是 USB，但协议支持不等于任何连接都会自动无条件可用。Host 通过 Client 与 Server 通信，Server 可提供 tools、resources、prompts 等能力，本页为保持入门清晰只聚焦工具。图中的 3×3 与 3+3 仅说明接口复用思路，不是代码量、连接数或成本测量。已有 SDK 或共享代码也能降低定制接入成本。", "refs": ["mcp"], "foot": "3 个应用、3 类服务的理想化适配示意，不是工程成本测量", "dark": false, "cover": false}, {"id": "context", "title": "工具变多，上下文也要精打细算", "chapter": "上下文", "body": "\n<div class=\"grid2\"><div><div class=\"slider-row\"><label for=\"server-count\">连接的服务数量<\/label><output for=\"server-count\" data-server-value><\/output><\/div><input id=\"server-count\" data-servers type=\"range\" min=\"1\" max=\"30\" value=\"20\"><div class=\"range-ends\"><span>1 个<\/span><span>30 个<\/span><\/div><div class=\"flat-row\" style=\"margin-top:30px\"><strong>每个服务<\/strong><span>10 个工具<\/span><\/div><div class=\"flat-row\"><strong>每个工具描述<\/strong><span>假设 100 tokens<\/span><\/div><div class=\"flat-row\"><strong>当前任务需要<\/strong><span>假设 5 个工具<\/span><\/div><p class=\"small\" style=\"margin-top:24px\">把完整工具描述全部加载，会和用户问题、历史消息及结果争夺上下文空间。<\/p><\/div><div><div class=\"label\">完整描述正文的 token 占用<\/div><div class=\"context-comparison\"><div class=\"context-line\"><div><span>一次加载全部工具<\/span><b data-all-tokens><\/b><\/div><div class=\"bar-track\"><div class=\"bar-fill\" data-all-fill><\/div><\/div><\/div><div class=\"context-line\"><div><span>按需加载 5 个工具<\/span><b>500<\/b><\/div><div class=\"bar-track\"><div class=\"bar-fill\" style=\"width:1.5625%;background:var(--orange)\"><\/div><\/div><\/div><\/div><p class=\"tiny\">条形以假设的 32,000 tokens 为标尺。<br>不计工具发现、元数据、系统提示和结果的额外开销。<\/p><p class=\"callout\" style=\"margin-top:25px\">动态工具发现解决“加载哪些工具”。<br>Skills 进一步组织“这项任务怎么做”。<\/p><\/div><\/div>", "lead": "拖动服务数量，观察完整工具描述占用如何增长。", "notes": "原文的 20 个服务乘以每个 10 个工具，是用来说明上下文负担的教学例子。本页额外假设每份完整工具描述为 100 tokens，标尺为 32000 tokens，不对应特定模型或实测。按需工具发现与 Skills 的渐进式说明是相关但不同的机制，不能宣称安装一个 Skill 就会自动隐藏所有无关工具。实际系统还要承担发现调用、元数据和输出等开销。", "refs": ["context"], "foot": "所有数量、描述长度和上下文标尺均为假设，不是实测节省", "dark": false, "cover": false}, {"id": "skills", "title": "Skills：把做事方法整理成可复用资源", "chapter": "任务方法", "body": "\n<div class=\"api-layout\"><div><div class=\"label\">SKILL PACKAGE<\/div><pre class=\"code\" style=\"margin-top:20px\">git-commit/\n  SKILL.md\n  references/\n    conventions.md\n  scripts/\n    check_changes.py<\/pre><p class=\"small\" style=\"margin-top:24px\">说明告诉 Agent 何时使用、怎么做；<br>附加资料与脚本在需要时加载或执行。<\/p><\/div><div><div class=\"annotation\"><b>01<\/b><div><h3>识别任务<\/h3><p>用户希望整理并提交当前代码变更。<\/p><\/div><\/div><div class=\"annotation\"><b>02<\/b><div><h3>使用已有方法<\/h3><p>检查改动，运行必要验证，按项目约定拟定提交说明。<\/p><\/div><\/div><div class=\"annotation\"><b>03<\/b><div><h3>遵守本次边界<\/h3><p>按当前请求与权限决定是否提交，处理异常并报告结果。<\/p><\/div><\/div><p class=\"callout\">Skill 可以提供 SOP，也能包含领域知识、示例、脚本与素材。<\/p><\/div><\/div>", "lead": "常见任务不必每次重新组织全部操作知识。", "notes": "Anthropic 在 2025 年 10 月发布 Agent Skills。其核心是按需可发现的指令、脚本和资源集合，而不只是函数清单。Skills 中的流程能帮助组织任务，但不是固定执行的确定性程序，也不是自动增加操作权限。目录为教学示意，不代表存在或安装了此 git-commit 技能。当前这套演示本身就是按用户选择的 HTML 演示技能制作。", "refs": ["skills"], "foot": "目录与提交流程为示意；技能不替代用户授权或项目规则", "dark": false, "cover": false}, {"id": "disclosure", "title": "渐进式披露：目录、正文、需要的细节", "chapter": "按需加载", "body": "\n<div class=\"segmented\" data-disclosure-tabs role=\"group\" aria-label=\"查看加载层级\"><button class=\"active\" data-level=\"0\" aria-pressed=\"true\">1 发现相关技能<\/button><button data-level=\"1\" aria-pressed=\"false\">2 阅读主说明<\/button><button data-level=\"2\" aria-pressed=\"false\">3 按需补充<\/button><\/div><div class=\"disclosure-grid\"><div class=\"disclosure-tree\"><div data-layer=\"0\"><span class=\"label\">LEVEL 1<\/span><h3>name + description<\/h3><p>帮助判断什么时候使用<\/p><\/div><div data-layer=\"1\"><span class=\"label\">LEVEL 2<\/span><h3>SKILL.md 正文<\/h3><p>当前任务的主要方法<\/p><\/div><div data-layer=\"2\"><span class=\"label\">LEVEL 3<\/span><h3>引用资料 / 脚本<\/h3><p>只取当前分支需要的内容<\/p><\/div><\/div><div class=\"vcenter\"><div class=\"label\" data-disclosure-label><\/div><h3 class=\"demo-title\" data-disclosure-title><\/h3><pre class=\"code\" data-disclosure-code><\/pre><p class=\"small\" data-disclosure-explain style=\"margin-top:20px\"><\/p><\/div><\/div>", "lead": "先知道有哪本手册，再读对应章节，最后查必要的附录。", "notes": "这里演示 Skills 公开描述的典型三级加载：先有名称与说明，相关时读 SKILL.md 主体，需要更具体信息时再取支持文件。脚本可以作为执行工具使用，不一定把整份代码读进模型上下文。每次都应避免无目的地读完所有资料。实际触发与加载行为取决于宿主实现和任务。", "refs": ["skills"], "foot": "加载层级示意，具体实现因宿主而异", "dark": false, "cover": false}, {"id": "agent", "title": "Agent：围绕目标运行的反馈循环", "chapter": "自主循环", "body": "\n<div class=\"agent-equation\">模型 <span>+<\/span> 工具 <span>+<\/span> 决策与反馈循环<\/div><div class=\"loop-grid\"><div><span class=\"label\">01 / OBSERVE<\/span><h3>获取上下文<\/h3><p>知道当前状态<br>收集需要的证据<\/p><\/div><div><span class=\"label\">02 / DECIDE<\/span><h3>选择下一步<\/h3><p>调用什么工具<br>是否需要补充信息<\/p><\/div><div><span class=\"label\">03 / ACT<\/span><h3>执行动作<\/h3><p>由运行环境<br>执行获准的请求<\/p><\/div><div><span class=\"label\">04 / VERIFY<\/span><h3>检查结果<\/h3><p>完成则停止<br>否则调整后继续<\/p><\/div><\/div><div class=\"loop-return\">结果与错误回到上下文，影响下一轮选择 <span>↶<\/span><\/div><p class=\"small\" style=\"margin-top:26px\">自动推进发生在任务范围、权限、预算与停止条件之内。<\/p>", "lead": "关键变化是：系统会根据实际结果，动态决定后续行动。", "notes": "Agent 的定义在业内存在不同用法。本课采用“模型动态决定行动并根据环境反馈循环”的实用理解。固定预定义代码路径可以构成工作流，Agent 更强调决策的动态性，二者也能组合。Agent 并不是 Skills 之后才出现，MCP 和 Skills 都是可选的增强机制。长期记忆也不是所有 Agent 的必备条件。", "refs": ["agents"], "foot": "系统示意；不表示任何任务都能自动成功", "dark": true, "cover": false}, {"id": "bug", "title": "修复 Bug：失败结果如何改变下一步", "chapter": "循环演示", "body": "\n<div class=\"bug-top\"><p class=\"quote\">“修复空列表导致的崩溃，并验证结果。”<\/p><span class=\"label\" data-bug-round><\/span><\/div><div class=\"bug-layout\"><div class=\"bug-steps\" data-bug-steps><\/div><div><div class=\"label\" data-bug-owner><\/div><h3 class=\"demo-title\" data-bug-title><\/h3><pre class=\"code bug-code\" data-bug-output><\/pre><p class=\"small\" data-bug-description style=\"margin-top:18px\"><\/p><\/div><\/div><div class=\"actions\" style=\"margin-top:23px\"><button class=\"action primary\" data-bug-next>下一步 →<\/button><button class=\"action\" data-bug-reset>重新开始<\/button><span class=\"tiny\" data-bug-count><\/span><\/div>", "lead": "同一个目标，不是只生成一次答案，而是执行、验证，再根据失败继续。", "notes": "模拟场景中，第一次改动只解决了直接崩溃，测试还发现返回类型不一致，于是 Agent 继续修改并重新测试。操作轨迹展示的是外部动作与结果，不是模型内部思维链。是否 commit 应遵循用户请求和仓库规则，完成测试不会自动构成提交授权。本演示不访问真实代码或运行真实测试。", "refs": ["agents", "sdk"], "foot": "固定教学轨迹，非真实代码执行或模型推理记录", "dark": false, "cover": false}, {"id": "layers", "title": "四个概念，对应四种责任", "chapter": "概念对照", "body": "\n<table class=\"compare\"><thead><tr><th>概念<\/th><th>回答的问题<\/th><th>天气例子中的位置<\/th><\/tr><\/thead><tbody><tr><td>Function Calling<\/td><td>模型如何提出工具请求？<\/td><td>选择 get_weather 并填入城市<\/td><\/tr><tr><td>MCP<\/td><td>应用如何以通用协议连接服务？<\/td><td>连接提供天气能力的 Server<\/td><\/tr><tr><td>Skill<\/td><td>这类任务应该怎样处理？<\/td><td>按规范核对地点、日期和答复格式<\/td><\/tr><tr><td>Agent<\/td><td>如何根据结果持续推进目标？<\/td><td>结果缺失时补充查询，再完成任务<\/td><\/tr><\/tbody><\/table><div class=\"process-notes\"><p>可以直接调用 API 构建 Agent，<br>不强制使用 MCP。<\/p><p> yout\"><div><div class=\"label\">THE TOWER / 课程后续主题<\/div><h3 class=\"takeaway-title\" style=\"margin-top:24px\">分工之后，<br>还需要<br><span class=\"accent\">协作机制。<\/span><\/h3><p class=\"lead\" style=\"margin-top:23px\">谁拆任务？谁提供证据？<br>谁检查结果，谁决定完成？<\/p><\/div><div><div class=\"tower-goal\">共同目标：修复并验证一个复杂问题<\/div><div class=\"tower-roles\"><div><strong>定位<\/strong><p>找出问题<br>与相关文件<\/p><\/div><div><strong>实现<\/strong><p>提出修改<br>与必要解释<\/p><\/div><div><strong>验证<\/strong><p>检查测试<br>与遗漏影响<\/p><\/div><\/div><div class=\"tower-check\">共享必要上下文，再汇总证据与结果<\/div><p class=\"small\" style=\"margin-top:24px\">多 Agent 也会增加沟通、冲突和验证成本。<br>应按任务需要决定是否拆分。<\/p><\/div><\/div>", "lead": "原文把这一步留给 THE TOWER：从单个任务循环，进入多角色协作。", "notes": "THE TOWER 是原文的后续课程线索，文章未提供其具体产品架构。本页只用概念示意承接课程，不补写任何未经提供的产品功能。多 Agent 可以带来并行和上下文隔离，但并不自动比单 Agent 更好。一个完整系统还需要清楚的交接、状态同步、停止与验证机制。", "refs": [], "foot": "THE TOWER 沿用原文命名；图示为课程概念，不是已实现架构", "dark": true, "cover": false}, {"id": "glossary", "title": "术语速查", "chapter": "知识回顾", "body": "\n<div class=\"segmented\" data-glossary-tabs role=\"group\" aria-label=\"选择术语分类\"><button class=\"active\" data-group=\"foundation\" aria-pressed=\"true\">模型与上下文<\/button><button data-group=\"tools\" aria-pressed=\"false\">工具与资源<\/button><button data-group=\"runtime\" aria-pressed=\"false\">运行与协作<\/button><\/div><div data-glossary class=\"glossary-list\"><\/div><p class=\"tiny\" style=\"margin-top:20px\">Token 与汉字、词数的换算并不固定，取决于模型的分词方式和具体文本。<\/p>", "lead": "点击分类，回看文章中的关键概念。", "notes": "本页保留原文的 14 个术语，并修正几个简化说法：LLM 是模型类别，聊天产品不等同于模型本身；Token 是分词单元，与汉字没有固定比例；上下文也可能包含工具结果等内容；RAG 不局限于预建向量索引；OAuth 的核心是委托授权，并不保证可以使用某个订阅账户调用 API。", "refs": ["rag", "oauth", "ndjson"], "foot": "术语为入门定义，具体格式与行为以所用模型和协议为准", "dark": false, "cover": false}, {"id": "closing", "title": "Agent 是组合后的系统形态", "chapter": "收束", "body": "\n<div class=\"takeaway\"><div><div class=\"label\">ONE IDEA TO REMEMBER<\/div><div class=\"takeaway-title\" style=\"margin-top:24px\">知道下一步，<br>执行它，<br><span class=\"accent\">再检查结果。<\/span><\/di const terms={foundation:[['LLM','大语言模型：处理和生成语言的模型类别。'],['Token','分词单元：模型用于表示与处理文本的片段。'],['上下文窗口','一次可处理的上下文容量，通常以 token 计。'],['RAG','检索增强生成：把检索到的信息用于生成回答，不限于向量检索。']],tools:[['Function Call / Tool Use','模型提出工具名与参数，由应用执行并返回结果的机制。'],['MCP','Model Context Protocol：连接应用与工具、数据等能力的通用协议。'],['MCP Server','通过 MCP 提供工具、资源等能力的服务端。'],['Skills','按需加载的任务说明、脚本与资源集合。'],['SDK','开发工具包：方便程序接入服务或使用某类能力的代码库。']],runtime:[['Agent','围绕目标，根据状态与反馈动态决定行动的系统。'],['Agentic Search','由 Agent 根据线索迭代搜索、阅读与核查的过程。'],['CLI','命令行界面：通过终端命令操作程序。'],['OAuth','委托授权机制：让应用在限定范围内访问资源。'],['NDJSON','每行一个 JSON 值的格式，便于逐行与流式处理。']]};
const slideBehaviors={
 function:{init(s){let index=0,timer=null;const q=x=>s.querySelector(x);const stop=()=>{if(timer!==null)clearInterval(timer);timer=null;q('[data-fc-play]').textContent='自动播放'};const render=()=>{const d=fnSteps[index];q('[data-fc-strip]').innerHTML=['用户问题','工具请求','程序执行','返回结果','生成回答'].map((t,i)=>`<div class="step-chip ${i<=index?'on':''} ${i===index?'current':''}"><small>0${i+1}</small>${t}</div>`).join('');q('[data-fc-owner]').textContent=d.owner;q('[data-fc-title]').textContent=d.title;q('[data-fc-description]').textContent=d.description;q('[data-fc-code]').textContent=d.code;q('[data-fc-count]').textContent=`${index+1} / ${fnSteps.length}`;q('[data-fc-next]').textContent=index===4?'回到开头 ↻':'下一步 →'};q('[data-fc-next]').onclick=()=>{stop();index=(index+1)%fnSteps.length;render()};q('[data-fc-reset]').onclick=()=>{stop();index=0;render()};q('[data-fc-play]').onclick=()=>{if(timer!==null){stop();return}if(matchMedia('(prefers-reduced-motion: reduce)').matches){index=4;render();return}index=0;render();q('[data-fc-play]').textContent='暂停';timer=setInterval(()=>{index++;render();if(index===4)stop()},900)};s.stopDemo=stop;render()},leave(s){s.stopDemo?.()},print(s){s.stopDemo?.()}},
 mcp:{init(s){const render=mode=>{selectedButton(s,'[data-mode]','mode',mode);const standard=mode==='standard';s.querySelector('[data-mcp-diagram]').innerHTML=standard?'<div class="mcp-hub">MCP · 统一交互契约</div><div class="connection-standard"><div class="stack"><div>App A / Client</div><div>App B / Client</div><div>App C / Client</div></div><div class="connection-arrow">↔</div><div class="stack"><div>天气 MCP Server</div><div>文件 MCP Server</div><div>邮件 MCP Server</div></div></div>':['A','B','C'].map(x=>`<div class="connection-row"><b>App ${x}</b><span class="connection-arrow">↔</span><span>天气适配 · 文件适配 · 邮件适配</span></div>`).join('');s.querySelector('[data-mcp-label]').textContent=standard?'协议两侧的适配示意':'逐对定制的适配示意';s.querySelector('[data-mcp-count]').textContent=standard?'3 + 3':'3 × 3';s.querySelector('[data-mcp-summary]').textContent=standard?'复用标准化接口':'每一对都需约定接口';s.querySelector('[data-mcp-detail]').textContent=standard?'应用侧支持协议，服务侧提供能力。新增参与方时，尽量复用既有约定。':'应用分别处理不同服务的接口差异，重复维护的工作可能随组合数增加。'};s.querySelector('[data-mcp-tabs]').onclick=e=>{const b=e.target.closest('[data-mode]');if(b)render(b.dataset.mode)};render('custom')}},
 context:{init(s){const input=s.querySelector('[data-servers]');const render=()=>{const count=Number(input.value),tokens=count*10*100;s.querySelector('[data-server-value]').textContent=`${count} 个`;s.querySelector('[data-all-tokens]').textContent=tokens.toLocaleString('en-US');s.querySelector('[data-all-fill]').style.width=`${tokens/32000*100}%`};input.oninput=render;render()}},
 disclosure:{init(s){const render=i=>{const d=disclosure[i];selectedButton(s,'[data-level]','level',i);s.querySelectorAll('[data-layer]').forEach((el,j)=>el.classList.toggle('on',j<=i));s.querySelector('[data-disclosure-label]').textContent=d[0];s.querySelector('[data-disclosure-title]').textContent=d[1];s.querySelector('[data-disclosure-code]').textContent=d[2];s.querySelector('[data-disclosure-explain]').textContent=d[3]};s.querySelector('[data-disclosure-tabs]').onclick=e=>{const b=e.target.closest('[data-level]');if(b)render(Number(b.dataset.level))};render(0)}},
 bug:{init(s){let index=0;const q=x=>s.querySelector(x);const render=()=>{const d=bugSteps[index];q('[data-bug-steps]').innerHTML=['观察与复现','定位与决策','执行修改','验证与反馈'].map((t,i)=>`<div class="bug-step ${d[0]===i?'active':''}">${String(i+1).padStart(2,'0')}　${t}</div>`).join('');q('[data-bug-round]').textContent=index>=4?'第二轮 / 反馈推动修正':'第一轮 / 发现并尝试解决';q('[data-bug-owner]').textContent=d[1];q('[data-bug-title]').textContent=d[2];q('[data-bug-output]').textContent=d[3];q('[data-bug-description]').textContent=d[4];q('[data-bug-count]').textContent=`${index+1} / ${bugSteps.length}`;q('[data-bug-next]').textContent=index===5?'重新演示 ↻':'下一步 →'};q('[data-bug-next]').onclick=()=>{index=(index+1)%bugSteps.length;render()};q('[data-bug-reset]').onclick=()=>{index=0;render()};render()}},
 retrieval:{init(s){const render=key=>{const d=searches[key];selectedButton(s,'[data-search]','search',key);s.querySelector('[data-search-label]').textContent=d.label;s.querySelector('[data-search-title]').textContent=d.title;s.querySelector('[data-search-description]').textContent=d.description;s.querySelector('[data-search-lesson]').textContent=d.lesson;s.querySelectorAll('[data-file]').forEach((el,i)=>el.classList.toggle('on',d.files.includes(i)))};s.querySelector('[data-search-tabs]').onclick=e=>{const b=e.target.closest('[data-search]');if(b)render(b.dataset.search)};render('entry')}},
 glossary:{init(s){const render=key=>{selectedButton(s,'[data-group]','group',key);s.querySelector('[data-glossary]').innerHTML=terms[key].map(([term,desc])=>`<div class="glossary-row"><b>${term}</b><p>${desc}</p></div>`).join('')};s.querySelector('[data-glossary-tabs]').onclick=e=>{const b=e.target.closest('[data-group]');if(b)render(b.dataset.group)};s.printState=null;s.beforeGlossaryPrint=()=>{s.printState=s.querySelector('[data-group].active').dataset.group;render('runtime')};s.restoreGlossary=()=>{if(s.printState){render(s.printState);s.printState=null}};render('foundation')}}
};


const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sourceLink(key){
 const source=sources[key];
 if(!source)throw new Error(`Unknown source key: ${key}`);
 const url=new URL(source[1]);
 if(!['https:','http:'].includes(url.protocol))throw new Error(`Unsupported source URL: ${key}`);
 return `<a href="${escapeHTML(url.href)}" target="_blank" rel="noopener noreferrer">${escapeHTML(source[0])} ↗</a>`;
}
if(!slides.length||new Set(slides.map(s=>s.id)).size!==slides.length||slides.some(s=>!s.id))throw new Error('Slides need unique nonempty ids');
document.title=deck.title;document.documentElement.lang=deck.lang||'zh-CN';$('brand').textContent=deck.brand;$('viewport').setAttribute('aria-label',deck.title);
const stage=$('stage'),sections=[];
slides.forEach((s,i)=>{
 const section=document.createElement('section');section.className=`slide${s.dark?' dark':''}`;section.id=`slide-${i+1}`;section.dataset.slideId=s.id;section.setAttribute('aria-label',`${i+1}. ${s.title}`);
 section.innerHTML=(s.cover?'':`<div class="eyebrow">${String(i+1).padStart(2,'0')} / ${escapeHTML(s.chapter)}</div><h2>${escapeHTML(s.title)}</h2>${s.lead?`<p class="lead">${escapeHTML(s.lead)}</p>`:''}`)+`<div class="content">${s.body}</div><div class="foot"><span>${escapeHTML(s.foot)}</span><span>${(s.refs||[]).slice(0,2).map(sourceLink).join('　')}</span></div>`;
 stage.append(section);sections.push(section);slideBehaviors[s.id]?.init?.(section);
});
let current=-1;
function fit(){if(innerWidth<=700){stage.style.transform='none';return}stage.style.transform=`scale(${Math.max(.1,Math.min((innerWidth-30)/1440,(innerHeight-95)/810))})`}
function invoke(index,hook){if(index>=0)slideBehaviors[slides[index].id]?.[hook]?.(sections[index])}
function showSlide(index,updateHash=true){
 invoke(current,'leave');current=Math.max(0,Math.min(slides.length-1,Number.isFinite(index)?Math.trunc(index):0));
 sections.forEach((el,i)=>{const active=i===current;el.classList.toggle('active',active);el.inert=!active;el.setAttribute('aria-hidden',String(!active))});
 $('pageCount').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;$('chapter').textContent=slides[current].chapter||'';$('progress').style.width=`${(current+1)/slides.length*100}%`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('announce').textContent=`第 ${current+1} 页，共 ${slides.length} 页。${slides[current].title}`;
 if(updateHash)history.replaceState(null,'',`#slide-${current+1}`);if(innerWidth<=700)window.scrollTo({top:0,behavior:'instant'});fit();invoke(current,'enter');
}
function showDialog(id){
 const dlg=$(id);if(dlg.open){dlg.close();return}document.querySelectorAll('dialog[open]').forEach(d=>d.close());
 if(id==='overview')dlg.querySelector('.overview-grid').innerHTML=slides.map((s,i)=>`<button class="${i===current?'current':''}" data-go="${i}" ${i===current?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')} / ${escapeHTML(s.chapter)}</span>${escapeHTML(s.title)}</button>`).join('');
 if(id==='notes'){dlg.querySelector('h2').textContent=`${String(current+1).padStart(2,'0')} · ${slides[current].title}`;dlg.querySelector('.notes-text').textContent=slides[current].notes||'本页无补充讲解。';const refs=slides[current].refs||[];dlg.querySelector('.notes-sources').innerHTML=refs.length?'对应资料：'+refs.map(sourceLink).join('　'):''}
 dlg.showModal();
}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else showDialog('help')}catch{showDialog('help')}}
$('prev').onclick=()=>showSlide(current-1);$('next').onclick=()=>showSlide(current+1);$('overviewButton').onclick=()=>showDialog('overview');$('notesButton').onclick=()=>showDialog('notes');$('helpButton').onclick=()=>showDialog('help');$('fullscreenButton').onclick=fullscreen;$('printButton').onclick=()=>window.print();
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').textContent=document.fullscreenElement?'退出全屏':'全屏';fit()});
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){document.querySelectorAll('dialog[open]').forEach(d=>d.close());showSlide(Number(go.dataset.go))}if(e.target.closest('.close'))e.target.closest('dialog').close()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.target.isContentEditable||e.target.matches('input,textarea,select')||document.querySelector('dialog[open]'))return;
 if((e.key===' '||e.key==='Enter')&&e.target.closest('button,a'))return;
 const key=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(key)){e.preventDefault();showSlide(current+1)}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();showSlide(current-1)}else if(key==='home'){e.preventDefault();showSlide(0)}else if(key==='end'){e.preventDefault();showSlide(slides.length-1)}else if(key==='o')showDialog('overview');else if(key==='n')showDialog('notes');else if(key==='f')fullscreen();else if(key==='?')showDialog('help');
});
let touchStart=null;
stage.addEventListener('touchstart',e=>{touchStart=null;if(e.target.closest('input,button,a,select,textarea')||e.touches.length!==1)return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)showSlide(current+(dx<0?1:-1));touchStart=null},{passive:true});
stage.addEventListener('touchcancel',()=>{touchStart=null},{passive:true});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{const match=location.hash.match(/^#slide-(\d+)$/);if(match)showSlide(Number(match[1])-1,false)});
window.addEventListener('beforeprint',()=>{invoke(current,'leave');sections.forEach((el,i)=>{el.inert=false;el.setAttribute('aria-hidden','false');invoke(i,'print')})});
window.addEventListener('afterprint',()=>{sections.forEach((el,i)=>invoke(i,'afterPrint'));showSlide(current,false)});
const initialMatch=location.hash.match(/^#slide-(\d+)$/);showSlide(initialMatch?Number(initialMatch[1])-1:0,false);
</script>
