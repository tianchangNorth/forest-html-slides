<script>
'use strict';
// 1. Replace these metadata, sources and slide samples for the requested subject.
const deck = {title:'墨绿交互演示 · 可复用骨架',brand:'FOREST / SLIDES',lang:'zh-CN'};
const sources = {};
const slides = [
 {id:'opening',cover:true,dark:true,title:'让复杂内容，清晰可见',chapter:'开场',foot:'版式与交互样本',refs:[],notes:'此封面展示原稿的墨绿底色、宽留白、大标题及右侧概念流程。复制骨架后，替换为新主题的主张和真实场景。',body:`<div class="hero-grid"><div><div class="hero-name">FOREST / SLIDES</div><h1>让复杂内容，<br>清晰可见。</h1><p class="hero-sub">一个具体场景，建立直觉<br>一次交互，解释关键机制</p><div class="hero-mark"><button class="action primary" data-go="1">开始演示 ↗</button></div><p class="cover-bottom">可离线播放的交互式演示</p></div><div class="hero-diagram"><div class="state-label">01 / QUESTION</div><div class="hero-state">一个值得解释的具体问题</div><div class="connector"></div><div class="engine"><strong>理解机制</strong><span>INPUT<br>PROCESS</span></div><div class="connector"></div><div class="hero-output"><div>观察变化<br><b>输入</b></div><div>发现关系<br><b>过程</b></div><div>形成判断<br><b>结果</b></div></div></div></div>`},
 {id:'mechanism',title:'先讲清一个具体过程',chapter:'原理',lead:'沿着输入、处理和结果组织解释，让观众知道每一步发生了什么。',foot:'概念流程版式样本',refs:[],notes:'这一页的三段流程用于展示可编辑的概念关系。节点数量和结构应由新主题决定，切勿把任意过程都强行拆成三步。',body:`<div class="pipeline"><div class="node"><div class="label">INPUT</div><div class="space"></div><strong>相关信息</strong><p>给出具体情境<br>说明已知条件</p></div><div class="arrow"></div><div class="node main"><div class="label">PROCESS</div><div class="space"></div><strong>核心机制</strong><p>解释真正发生的变化<br>保留必要技术细节</p></div><div class="arrow"></div><div class="node"><div class="label">OUTPUT</div><div class="space"></div><strong>可观察结果</strong><p>指出产物或行动<br>连接实际用途</p></div></div><div class="process-notes"><p>使用具体实例，把抽象术语变成看得见的输入与输出。</p><p>长解释放在讲解备注，页面保留支持本页主问题的内容。</p></div>`},
 {id:'comparison',title:'用同一维度比较两种方案',chapter:'对比',lead:'明确比较任务与条件，避免把一个维度的优势扩展为全面优势。',foot:'表格中的方案 A / B 为虚构示例，需替换成新主题内容',refs:[],notes:'同一个任务、同一组比较维度可以帮助观众判断差异。填写新内容时，为具体性能与能力主张提供依据，不沿用示例中的描述。',body:`<table class="compare"><thead><tr><th>维度</th><th>方案 A</th><th>方案 B</th></tr></thead><tbody><tr><td>输入条件</td><td>接受范围较广的输入</td><td>需要预先整理输入范围</td></tr><tr><td>产出形式</td><td>开放式结果</td><td>预先约定的结果</td></tr><tr><td>适用目标</td><td>探索多种可能</td><td>完成边界明确的步骤</td></tr><tr><td>验证方法</td><td>检查结果是否满足目标</td><td>检查规则与实际效果</td></tr></tbody></table><p class="callout" style="margin-top:35px">比较页的目的，是帮助观众理解取舍和适用条件。</p>`},
 {id:'experiment',title:'让参数变化带来可见结果',chapter:'交互',lead:'拖动权重，观察分数与处理分支一起改变。',foot:'教学模拟；虚构评分与阈值，不代表业务决策建议',refs:[],notes:'演示数据固定：质量得分 0.80、时效得分 0.40，综合分数为 0.80w + 0.40(1−w)。权重为 0.50 时分数为 0.60。阈值 0.65 仅用于展示状态变化。新主题应换成有依据的公式和输入。',body:`<div class="grid2"><div class="vcenter"><div class="slider-row"><label for="weight-control">质量权重 w</label><output data-weight for="weight-control"></output></div><input id="weight-control" data-weight-input type="range" min="0" max="100" value="50" step="1"><div class="range-ends"><span>更看重时效</span><span>更看重质量</span></div><div class="space"></div><div class="flat-row"><strong>质量得分</strong><span class="mono">0.80</span></div><div class="flat-row"><strong>时效得分</strong><span class="mono">0.40</span></div><div class="space"></div><button class="action" data-reset>重置参数</button></div><div class="confidence-box"><div class="label">WEIGHTED SCORE</div><div class="number accent" data-score style="margin-top:20px"></div><div class="formula">S = 0.80w + 0.40(1 − w)</div><div class="bar-track" role="img" data-score-chart><div class="bar-fill" data-score-fill></div></div><div class="route-result" data-result aria-live="polite"><b data-route></b><span data-condition></span></div><p class="small" style="margin-top:20px">分数达到 0.65 时进入优先队列。<br>同一组输入，权重改变会影响结果。</p></div></div>`},
 {id:'conclusion',title:'关键结论与适用边界',chapter:'收束',dark:true,foot:'深色收束版式样本',refs:[],notes:'结束时留下一个核心判断，以及观众理解它需要的边界。按新主题选择合适的结论，不强制固定成三项。',body:`<div class="takeaway"><div><div class="label">ONE IDEA TO REMEMBER</div><div class="space"></div><div class="takeaway-title">让一个问题，<br>有清楚的<br><span class="accent">解释路径。</span></div><p class="lead">场景建立直觉，<br>机制支持判断。</p></div><div><div class="role"><strong>结论</strong><p>用简单语言说清最重要的发现。</p></div><div class="role"><strong>条件</strong><p>指出结论依赖哪些前提与证据。</p></div><div class="role"><strong>应用</strong><p>解释什么时候值得采用，以及如何验证。</p></div></div></div>`},
 {id:'evidence',title:'依据和假设放在观众看得到的地方',chapter:'说明',lead:'引用、单位、日期和局限共同构成完整的判断依据。',foot:'骨架说明；成品中替换为与主题相关的资料来源',refs:[],notes:'本骨架没有引用外部事实。新主题的 sources 应填入经过核实的来源，并由具体幻灯片通过 refs 指向它们。此页可改成真实来源列表，或者按用户要求省略。',body:`<div class="grid2"><div class="split-lane"><div class="dual-title">EVIDENCE / 依据</div><div class="flat-row"><strong>资料来源</strong><span>链接到具体页面</span></div><div class="flat-row"><strong>数据口径</strong><span>明确时间与单位</span></div><div class="flat-row"><strong>比较条件</strong><span>说清测试环境</span></div></div><div class="split-lane"><div class="dual-title">ASSUMPTIONS / 假设</div><p class="quote">把实测结果、外部声明与教学模拟分开说明。</p><div class="space"></div><p class="small">动画说明机制，交互帮助理解。<br>它们本身不构成性能或能力的证据。</p></div></div>`}
];

// 2. Optional per-slide behavior. All queries are local to the slide section.
const slideBehaviors = {
 experiment: {
  init(section) {
   const q=selector=>section.querySelector(selector);
   const input=q('[data-weight-input]');
   const render=()=>{
    const weight=Number(input.value)/100,score=.8*weight+.4*(1-weight),priority=score>=.65-1e-9;
    q('[data-weight]').textContent=weight.toFixed(2);
    q('[data-score]').textContent=score.toFixed(2);
    q('[data-score-fill]').style.width=`${score*100}%`;
    q('[data-score-chart]').setAttribute('aria-label',`综合分数 ${score.toFixed(2)}`);
    q('[data-route]').textContent=priority?'优先队列':'普通队列';
    q('[data-condition]').textContent=`${score.toFixed(2)} ${priority?'≥':'<'} 0.65`;
    q('[data-result]').classList.toggle('review',!priority);
   };
   input.addEventListener('input',render);
   q('[data-reset]').addEventListener('click',()=>{input.value='50';render()});
   render();
  }
 }
};

// 3. Shared presentation runtime. Usually keep this section unchanged.
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sourceLink(key){
 const source=sources[key];
 if(!source)throw new Error(`Unknown source key: ${key}`);
 const url=new URL(source[1]);
 if(!['https:','http:'].includes(url.protocol))throw new Error(`Unsupported source URL: ${key}`);
 return `<a href="${escapeHTML(url.href)}" target="_blank" rel="noopener noreferrer">${escapeHTML(source[0])} ↗</a>`;
}
if(!slides.length||new Set(slides.map(s=>s.id)).size!==slides.length||slides.some(s=>!s.id))throw new Error('Slides need unique nonempty ids');
document.title=deck.title;document.documentElement.lang=deck.lang||'zh-CN';$('brand').textContent=deck.brand;$('viewport').setAttribute('aria-label',deck.title);
const stage=$('stage'),sections=[];
slides.forEach((s,i)=>{
 const section=document.createElement('section');section.className=`slide${s.dark?' dark':''}`;section.id=`slide-${i+1}`;section.dataset.slideId=s.id;section.setAttribute('aria-label',`${i+1}. ${s.title}`);
 section.innerHTML=(s.cover?'':`<div class="eyebrow">${String(i+1).padStart(2,'0')} / ${escapeHTML(s.chapter)}</div><h2>${escapeHTML(s.title)}</h2>${s.lead?`<p class="lead">${escapeHTML(s.lead)}</p>`:''}`)+`<div class="content">${s.body}</div><div class="foot"><span>${escapeHTML(s.foot)}</span><span>${(s.refs||[]).slice(0,2).map(sourceLink).join('　')}</span></div>`;
 stage.append(section);sections.push(section);slideBehaviors[s.id]?.init?.(section);
});
let current=-1;
function fit(){if(innerWidth<=700){stage.style.transform='none';return}stage.style.transform=`scale(${Math.max(.1,Math.min((innerWidth-30)/1440,(innerHeight-95)/810))})`}
function invoke(index,hook){if(index>=0)slideBehaviors[slides[index].id]?.[hook]?.(sections[index])}
function showSlide(index,updateHash=true){
 invoke(current,'leave');current=Math.max(0,Math.min(slides.length-1,Number.isFinite(index)?Math.trunc(index):0));
 sections.forEach((el,i)=>{const active=i===current;el.classList.toggle('active',active);el.inert=!active;el.setAttribute('aria-hidden',String(!active))});
 $('pageCount').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;$('chapter').textContent=slides[current].chapter||'';$('progress').style.width=`${(current+1)/slides.length*100}%`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('announce').textContent=`第 ${current+1} 页，共 ${slides.length} 页。${slides[current].title}`;
 if(updateHash)history.replaceState(null,'',`#slide-${current+1}`);if(innerWidth<=700)window.scrollTo({top:0,behavior:'instant'});fit();invoke(current,'enter');
}
function showDialog(id){
 const dlg=$(id);if(dlg.open){dlg.close();return}document.querySelectorAll('dialog[open]').forEach(d=>d.close());
 if(id==='overview')dlg.querySelector('.overview-grid').innerHTML=slides.map((s,i)=>`<button class="${i===current?'current':''}" data-go="${i}" ${i===current?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')} / ${escapeHTML(s.chapter)}</span>${escapeHTML(s.title)}</button>`).join('');
 if(id==='notes'){dlg.querySelector('h2').textContent=`${String(current+1).padStart(2,'0')} · ${slides[current].title}`;dlg.querySelector('.notes-text').textContent=slides[current].notes||'本页无补充讲解。';const refs=slides[current].refs||[];dlg.querySelector('.notes-sources').innerHTML=refs.length?'对应资料：'+refs.map(sourceLink).join('　'):''}
 dlg.showModal();
}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else showDialog('help')}catch{showDialog('help')}}
$('prev').onclick=()=>showSlide(current-1);$('next').onclick=()=>showSlide(current+1);$('overviewButton').onclick=()=>showDialog('overview');$('notesButton').onclick=()=>showDialog('notes');$('helpButton').onclick=()=>showDialog('help');$('fullscreenButton').onclick=fullscreen;$('printButton').onclick=()=>window.print();
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').textContent=document.fullscreenElement?'退出全屏':'全屏';fit()});
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){document.querySelectorAll('dialog[open]').forEach(d=>d.close());showSlide(Number(go.dataset.go))}if(e.target.closest('.close'))e.target.closest('dialog').close()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey||e.target.isContentEditable||e.target.matches('input,textarea,select')||document.querySelector('dialog[open]'))return;
 if((e.key===' '||e.key==='Enter')&&e.target.closest('button,a'))return;
 const key=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(key)){e.preventDefault();showSlide(current+1)}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();showSlide(current-1)}else if(key==='home'){e.preventDefault();showSlide(0)}else if(key==='end'){e.preventDefault();showSlide(slides.length-1)}else if(key==='o')showDialog('overview');else if(key==='n')showDialog('notes');else if(key==='f')fullscreen();else if(key==='?')showDialog('help');
});
let touchStart=null;
stage.addEventListener('touchstart',e=>{touchStart=null;if(e.target.closest('input,button,a,select,textarea')||e.touches.length!==1)return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)showSlide(current+(dx<0?1:-1));touchStart=null},{passive:true});
stage.addEventListener('touchcancel',()=>{touchStart=null},{passive:true});
window.addEventListener('resize',fit);
window.addEventListener('hashchange',()=>{const match=location.hash.match(/^#slide-(\d+)$/);if(match)showSlide(Number(match[1])-1,false)});
window.addEventListener('beforeprint',()=>{invoke(current,'leave');sections.forEach((el,i)=>{el.inert=false;el.setAttribute('aria-hidden','false');invoke(i,'print')})});
window.addEventListener('afterprint',()=>{sections.forEach((el,i)=>invoke(i,'afterPrint'));showSlide(current,false)});
const initialMatch=location.hash.match(/^#slide-(\d+)$/);showSlide(initialMatch?Number(initialMatch[1])-1:0,false);
</script>
</body>
