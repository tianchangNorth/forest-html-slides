<script>
'use strict';
const sources={
 intro:['System One 模型概念','https://docs.typesafe.ai/concepts/system-one'],
 primitives:['问题原语与并行调用','https://docs.typesafe.ai/primitives'],
 choice:['Choice','https://docs.typesafe.ai/primitives/choice'],
 score:['Score','https://docs.typesafe.ai/primitives/score'],
 noul:['Noul','https://docs.typesafe.ai/primitives/noul'],
 confidence:['Probability 与 Confidence','https://docs.typesafe.ai/confidence'],
 primer:['训练目标与 RLCD','https://docs.typesafe.ai/introduction/machine-learning-primer'],
 api:['HTTP API','https://api.typesafe.ai/redoc'],
 launch:['Jev 官方发布文章','https://typesafe.ai/blog/introducing-system-one-models-and-jev'],
 models:['模型规格与定价','https://docs.typesafe.ai/models'],
 evals:['工作流评测方法','https://evals.typesafe.ai/'],
 limits:['Jev 1.13 已知局限','https://docs.typesafe.ai/model-jaggedness/jev-1.13'],
 patterns:['应用组合模式','https://docs.typesafe.ai/patterns'],
 routing:['意图路由','https://docs.typesafe.ai/patterns/intent-routing'],
 use:['应用场景','https://docs.typesafe.ai/concepts/use-case-map'],
 structured:['LLM 结构化输出','https://platform.claude.com/docs/en/build-with-claude/structured-outputs']
};
const sourceLink=(key)=>`<a href="${sources[key][1]}" target="_blank" rel="noopener noreferrer">${sources[key][0]} ↗</a>`;
const slides=[
{title:'把语义判断，放进软件',chapter:'开场',dark:true,refs:['intro'],foot:'2026.10.02 · 基于公开资料',body:`
<div class="hero-grid"><div><div class="hero-name">SYSTEM ONE / JEV</div><h1>把语义判断，<br>放进软件。</h1><p class="hero-sub">理解它的原理与应用<br>也理解它与生成式大模型的分工</p><div class="hero-mark"><button class="action primary" data-go="1">开始演示 <span>↗</span></button><span class="small">17 页 · 约 15 分钟</span></div><p class="cover-bottom">面向产品与技术团队的交互式讲解</p></div><div class="hero-diagram" aria-label="状态输入 Jev 后得到分类、概率和评分的流程图"><div class="state-label">01 / UNSTRUCTURED STATE</div><div class="hero-state">“同一个订单扣了两次款，<br>请尽快帮我处理。”</div><div class="connector"></div><div class="engine"><strong>jev.</strong><span>READ STATE<br>ANSWER QUESTIONS</span></div><div class="connector"></div><div class="state-label">02 / TYPED DECISIONS</div><div class="hero-output"><div>业务分类<br><b>billing</b></div><div>退款诉求<br><b>0.96</b></div><div>情绪评分<br><b>1.20</b></div></div><p class="tiny" style="margin-top:25px">数值为教学示例，非模型实测。</p></div></div>`,notes:'先从一个产品问题开始：客服消息到达后，软件需要知道交给谁、是否紧急、是否需要进一步核查。Jev 是 TypeSafe 的首个 System One 模型，设计目标是把这类边界清楚的语义判断作为软件函数使用。本演示里的动画、工单概率和成本情景都是教学模拟，只有明确标注的规格和性能数据来自官方。'},
{title:'同一条消息，两种输出',chapter:'建立直觉',refs:['intro','primitives'],foot:'同一任务的输出形式示意；并非能力对跑',lead:'“同一个订单扣了两次款，请尽快帮我处理。”',body:`<div class="grid2"><div class="split-lane"><div class="dual-title">GENERATIVE LLM / 生成文本</div><p class="quote">“这看起来是一个重复扣款问题，建议交给账单团队，并核实交易记录……”</p><div class="space"></div><p class="small">适合向人解释、写回复，或继续规划任务。<br>也可以通过结构化输出返回 JSON。</p></div><div class="split-lane"><div class="dual-title">JEV / 回答预先定义的问题</div><div class="flat-row"><strong>应交给哪个团队？</strong><span class="mono">billing</span></div><div class="flat-row"><strong>是否表达退款诉求？</strong><span class="mono">P(yes) = 0.96</span></div><div class="flat-row"><strong>情绪处于哪个等级？</strong><span class="mono">1.20 / 2</span></div><div class="space"></div><p class="small">返回值直接交给代码。<br>检查订单、分派工单和执行退款由业务系统负责。</p></div></div>`,notes:'传统生成式大模型的优势是开放式表达与多步任务。Jev 的接口让调用者先定义问题类型和答案空间，再输出该空间内的值。请不要把此页解读为 LLM 不能返回 JSON。重要区别是模型的原生任务与输出机制，不是接口表面有没有花括号。此处退款诉求是对文本的判断，不是已经验证重复扣款属实。'},
{title:'Jev 的工作原理',chapter:'原理',refs:['intro','primitives','primer'],foot:'概念流程图；不代表尚未公开的内部网络结构',lead:'System One 是模型类别，Jev 是首个实现。可以把它看成一个“会理解语义的判断函数”。',body:`<div class="pipeline"><div class="node"><div class="label">INPUT</div><div class="space"></div><strong>业务状态 + 问题</strong><p>文本、JSON、文本数组<br>以及明确的答案范围</p></div><div class="arrow"></div><div class="node main"><div class="label">SYSTEM ONE / JEV</div><div class="space"></div><strong>独立、并行地判断</strong><p>多个问题读取同一份状态<br>直接给出类型值与概率</p></div><div class="arrow"></div><div class="node"><div class="label">YOUR SOFTWARE</div><div class="space"></div><strong>代码组合与执行</strong><p>判断阈值、业务规则<br>路由、补充信息或复核</p></div></div><div class="process-notes"><p><span class="accent">“System One”</span> 借用快速、直觉式判断的比喻，适合问题边界清晰的即时决策。</p><p>公开资料说明了训练方向与输出机制；具体网络层、参数规模及训练配方尚未完整披露。</p></div>`,notes:'名称受“思考，快与慢”的 System 1 启发，这只是命名与设计比喻，不是对人脑的实现，也不能据此把所有 LLM 等同于慢思考。一次请求中的问题共享状态，但彼此独立，不会读取同批其他答案。若 B 的判断需要 A 的结果，要由程序在后续调用中传入。我们展示的是已公开的机制层次，不假设它就是某种确定的编码器或分类头。'},
{title:'三个判断原语',chapter:'原理',refs:['choice','noul','score'],foot:'点击切换；所有概率和评分为教学示例',lead:'先决定你需要哪一种答案，再写问题。',body:`<div class="segmented" id="primitiveTabs" role="group" aria-label="选择判断原语"><button class="active" data-primitive="choice" aria-pressed="true">Choice · 选一个</button><button data-primitive="noul" aria-pressed="false">Noul · 是或否</button><button data-primitive="score" aria-pressed="false">Score · 评等级</button></div><div class="primitive-layout"><div><div class="label" id="primitiveKind"></div><div class="primitive-question" id="primitiveQuestion"></div><div class="primitive-value accent" id="primitiveValue"></div><p class="small" style="margin-top:21px" id="primitiveExplanation"></p></div><div><div id="primitiveBars"></div><pre class="code primitive-code" id="primitiveCode"></pre></div></div>`,notes:'Choice 在预设选项中选一个，返回选中的键、各选项概率以及 confidence。Noul 返回 yes 的概率 noul，没有单独的 confidence。Score 的标尺需要给每个有序等级清晰定义，结果可以是小数，不是必须落在某个整数等级。本页 Score 的 1.20 来自 0×0.05 + 1×0.70 + 2×0.25。当前文档给出 Choice 最多 255 项，Score 为 2 到 10 个等级。'},
{title:'输入设计决定判断边界',chapter:'原理',refs:['api','choice'],foot:'简化 HTTP 请求示例；不是实时 API 调用',lead:'把“处理好这个客户”拆成软件能使用的具体问题。',body:`<div class="api-layout"><pre class="code">{
  <span class="key">"model"</span>: <span class="str">"jev-latest"</span>,
  <span class="key">"state"</span>: {
    <span class="key">"message"</span>: <span class="str">"同一订单扣款两次，请处理"</span>
  },
  <span class="key">"questions"</span>: {
    <span class="key">"team"</span>: {
      <span class="key">"type"</span>: <span class="str">"choice"</span>,
      <span class="key">"instructions"</span>: <span class="str">"应交给哪个团队？"</span>,
      <span class="key">"criteria"</span>: {
        <span class="key">"billing"</span>: <span class="str">"付款、扣费或退款问题"</span>,
        <span class="key">"technical"</span>: <span class="str">"功能故障或使用问题"</span>,
        <span class="key">"account"</span>: <span class="str">"登录、权限或账户问题"</span>
      }
    }
  }
}</pre><div class="vcenter"><div class="annotation"><b>01</b><div><h3>State：给出相关证据</h3><p>只提供消息就只能判断消息语义。核实扣款还需要账单或订单记录。</p></div></div><div class="annotation"><b>02</b><div><h3>Question：一次问清一件事</h3><p>“分给哪个团队”比“全面解决客户问题”更适合直接消费的判断。</p></div></div><div class="annotation"><b>03</b><div><h3>Criteria：明确选项含义</h3><p>应用可增设 other / review 选项，再结合概率决定是否自动处理。</p></div></div></div></div>`,notes:'接口使用 POST https://api.typesafe.ai/v1/systemone，服务端通过 Authorization 头传递 API key。这个 HTML 不连接服务，不存储密钥。示例只展示 Choice 以便聚焦输入设计；真正集成时可以在 questions 中混合多个类型。候选选项的说明决定模型对类别的理解。没有相应证据时，不能把分类标签当作事件已经发生的证明。'},
{title:'逐词生成与并行决策',chapter:'原理',refs:['primitives','launch'],foot:'机制动画，不代表实测延迟或速度比例',lead:'生成式 LLM 通常逐 token 解码。Jev 在一次请求中并行返回多个问题的结果。',body:`<div class="race-grid"><div class="race-lane"><h3>生成式 LLM</h3><p class="small">前一个 token 影响后一个 token</p><div class="token-box" id="tokenOutput"></div><div class="sweep"><div id="tokenProgress"></div></div><div class="race-status" id="tokenStatus">等待演示</div></div><div class="race-lane"><h3>Jev</h3><p class="small">同一状态上的独立判断一起返回</p><div class="token-box race-parallel" id="parallelOutput"><span>team = billing</span><span>refund_request = 0.96</span><span>frustration = 1.20</span></div><div class="sweep"><div id="parallelProgress"></div></div><div class="race-status" id="parallelStatus">等待演示</div></div></div><div class="replay-row"><button class="action primary" id="replayRace">播放机制对比 ↻</button><p class="tiny">一批问题相互独立。<br>需要前一步答案的后续问题，仍要分步调用。</p></div>`,notes:'点击按钮，左侧把一个教学用 JSON 逐段写出，右侧三个结果一起出现。动画时长是为了说明顺序依赖与并行输出，不是 benchmark。LLM 也能并发多个请求，也可能采用投机解码等推理优化，所以不要把所有 LLM 调用都理解成严格串行的完整系统。这里对比的是典型自回归文本输出与 Jev 公开描述的并行决策机制。增加问题仍会增加输入与计算，不能说“无限问题免费”。'},
{title:'RLCD：让概率与实际频率相符',chapter:'原理',refs:['primer'],foot:'校准图为理想化教学数据，不是 Jev 的实测校准曲线',lead:'Reinforcement Learning for Calibrated Decisions · 面向校准决策的强化学习',body:`<div class="grid2"><div><div class="segmented" id="calTabs" role="group" aria-label="校准示例"><button class="active" data-cal="good" aria-pressed="true">校准良好</button><button data-cal="over" aria-pressed="false">过度自信</button></div><div class="chart-axis"><span>一组预测中，事件实际发生比例</span><span>100%</span></div><div class="chart-area" id="calChart"></div><div class="legend"><span><i></i>模型报告的概率</span><span><i class="actual"></i>实际发生比例</span></div><div class="cal-summary" id="calSummary"></div></div><div class="vcenter"><h3>概率需要经得起批量检验</h3><p class="lead">如果模型对一组事件都报 80%，<br>理想情况下，这组事件约 80% 会发生。</p><div class="space"></div><p class="callout">校准描述的是一组预测。<br>单个 0.8 的判断仍然可能出错。</p><div class="space"></div><p class="small">RLHF 侧重人类偏好的输出；RLVR 借助可验证奖励；官方将 RLCD 定位于结构化决策及概率校准。</p></div></div>`,notes:'先看两种图形的差别：报告概率与实际频率接近时，概率才便于转化为业务阈值。RLCD 是官方披露的训练方向，公开资料没有提供完整的奖励函数、网络层或训练配方。我们不能把一张理想化曲线当成实证，也不能推论所有任务、语言和分布上的概率都已经充分校准。校准良好仍可对应有限的预测能力，需要同时评估区分能力与实际错误成本。'},
{title:'概率与 confidence 的区别',chapter:'原理',refs:['confidence'],foot:'三选一分布可拖动；confidence 使用官方 Choice 公式计算',lead:'probability 表示某个答案的概率；confidence 把分布的明确程度压缩成一个数。',body:`<div class="grid2"><div><div class="slider-row"><label for="probSlider">最优选项的概率 pₘₐₓ</label><output id="probValue" for="probSlider">0.90</output></div><input id="probSlider" type="range" min="34" max="100" value="90" step="1"><div class="range-ends"><span>选项接近均分</span><span>选项十分明确</span></div><div id="confidenceBars" style="margin-top:34px"></div><p class="small" style="margin-top:24px">示例中，其余概率平均分给另外两个选项。</p></div><div class="confidence-box"><div class="label">CHOICE CONFIDENCE / 三个选项</div><div class="number accent" id="confidenceValue" style="margin-top:20px">0.85</div><div class="formula">C = (pₘₐₓ − 1/3) / (1 − 1/3)</div><p class="small">它由选项概率计算，不能直接读成“本次有 85% 的正确率”。选项集合改变时，也要重新评估阈值。</p><div class="space"></div><p class="tiny">Noul 仅返回 P(yes)，接近 0.5 表示不确定。<br>Score 的 confidence 还会考虑等级之间的距离。</p></div></div>`,notes:'把滑块调到 90%，三选一的 confidence 是 0.85；调到 60%，confidence 是 0.40。它是一项从概率分布派生的统计量，不是另一个独立的正确率估计。官方 Choice 公式只取最大概率与选项数量。Noul 则没有单独的 confidence 字段，p 接近零表示明确偏向 no，p 接近一表示明确偏向 yes，两端都可以很确定。'},
{title:'与传统生成式大模型的区别',chapter:'对比',refs:['intro','primer','structured'],foot:'比较典型使用方式；并不意味着一方在所有任务上占优',lead:'差异贯穿输出契约、训练方向与工作方式。',body:`<table class="compare"><thead><tr><th>比较维度</th><th>生成式 LLM</th><th>System One / Jev</th></tr></thead><tbody><tr><td>主要产物</td><td>开放式文本、代码，也可生成结构化值</td><td>预定义空间中的选项、评分与概率</td></tr><tr><td>输出机制</td><td>典型方式为自回归 token 解码</td><td>针对同一状态并行回答独立问题</td></tr><tr><td>训练侧重</td><td>语言建模，及指令、偏好或推理训练</td><td>官方披露以 RLCD 优化校准决策</td></tr><tr><td>约束与可靠性</td><td>结构化输出也能约束格式；语义仍可能错</td><td>原生约束答案类型；仍可能选错或评分失准</td></tr><tr><td>适合任务</td><td>写作、解释、编程、开放式规划</td><td>分类、路由、排序、审核中的窄问题</td></tr><tr><td>系统责任</td><td>应用负责校验、权限、执行与失败处理</td><td>应用同样负责规则、执行与失败处理</td></tr></tbody></table>`,notes:'这一页是对比的关键。不要说 Jev 的区别只是“会输出 JSON”，因为受约束解码的 LLM 同样可以按 schema 输出。也不要以模型尺寸或参数量解释差别，公开资料不足以支持。这里的“传统”指典型自回归生成式模型；现实中 LLM 可以包含多模态能力、推理优化和工具工作流，并非单一固定架构。Jev 的价值需要在有明确答案空间的任务上验证。'},
{title:'交互实验：工单如何分流',chapter:'应用',refs:['routing','confidence'],foot:'预设教学样本；阈值只控制工单分流，不授予退款或其他操作权限',lead:'切换消息，再调整阈值，观察同一个模型判断如何触发不同的业务流程。',body:`<div class="ticket-demo"><div><div class="segmented" id="ticketTabs" role="group" aria-label="选择工单样本"><button class="active" data-ticket="clear" aria-pressed="true">扣款问题</button><button data-ticket="ambiguous" aria-pressed="false">信息模糊</button><button data-ticket="technical" aria-pressed="false">功能故障</button></div><p class="ticket-message" id="ticketMessage"></p><div id="ticketBars" style="margin-top:26px"></div><div class="route-meta"><span>Choice confidence</span><b class="mono" id="ticketConfidence"></b></div></div><div class="vcenter"><div class="slider-row"><label for="thresholdSlider">自动分流阈值 τ</label><output id="thresholdValue" for="thresholdSlider">0.80</output></div><input id="thresholdSlider" type="range" min="0" max="100" value="80" step="1"><div class="range-ends"><span>更多自动处理</span><span>更多交给复核</span></div><div class="route-result" id="routeResult" aria-live="polite"><b id="routeText"></b><span id="routeCondition"></span></div><pre class="code" style="margin-top:22px;font-size:17px">if (answer.confidence &gt;= threshold) {
  routeTicket(answer.choice);
} else {
  requestReview();
}</pre><p class="tiny" style="margin-top:17px">阈值是产品策略，需要在本业务的标注样本上验证。</p></div></div>`,notes:'先保持默认阈值 0.80。清晰扣款样本的 billing 概率 0.90，三选一 confidence 为 0.85，自动转账单队列。模糊样本的最高概率仅 0.40，confidence 为 0.10，因此转复核。拖动阈值可以看到：模型输出不变，系统行为依然可以改变。这就是把判断和业务规则分开的意义。降低阈值会增加覆盖率，也可能增加错误分流，需要用真实数据测量，不能据教学样本估计收益。'},
{title:'Jev 与 LLM 的协同工作流',chapter:'应用',dark:true,refs:['patterns','primitives'],foot:'流程动画为架构示例；具体执行权限仍由业务系统管理',lead:'让窄判断进入控制流程，让生成式模型完成需要表达与创作的部分。',body:`<div class="flowline"><div class="flowstep on" data-flow-step="0"><div class="label">01 / JEV</div><h3>判断用户意图</h3><p>分类、紧急程度<br>需要哪类处理</p></div><div class="arrow"></div><div class="flowstep" data-flow-step="1"><div class="label">02 / CODE</div><h3>获取事实与规则</h3><p>查询订单记录<br>检查权限与金额</p></div><div class="arrow"></div><div class="flowstep" data-flow-step="2"><div class="label">03 / LLM</div><h3>生成有依据的回复</h3><p>使用已核实事实<br>组织自然语言</p></div><div class="arrow"></div><div class="flowstep" data-flow-step="3"><div class="label">04 / JEV + CODE</div><h3>检查后再流转</h3><p>检查回复是否获证据支持<br>代码放行或转复核</p></div></div><p class="flow-status" id="flowStatus">从用户输入开始，逐步观察模型与代码的分工。</p><div class="actions"><button class="action primary" id="flowNext">播放下一步 →</button><button class="action" id="flowReset">重置</button></div><p class="small" style="margin-top:27px">每个阶段传递具体状态。后续判断依赖新证据时，用新的调用完成。</p>`,notes:'Jev 可以用于 LLM 前的路由，也可以用于输出后的检查。但模型审核并不是不可突破的安全边界，权限检查与关键业务规则必须保留在确定性代码中。对退款例子，读取订单记录是代码或已授权工具完成的；LLM 用这些事实写草稿；Jev 只问“这句说法是否得到提供的证据支持”等范围明确的问题。是否真正发送和执行，要满足业务系统的授权要求。'},
{title:'应用落点：频繁、具体、可验证的判断',chapter:'应用',refs:['use','patterns','evals'],foot:'候选应用示例；不表示这些场景已获得统一性能保证',lead:'选择左侧场景，查看模型与代码分别负责什么。',body:`<div class="use-layout"><div class="use-nav" role="group" aria-label="选择应用场景"><button class="active" data-use="support" aria-pressed="true">01 客服分流</button><button data-use="rag" aria-pressed="false">02 检索与引用</button><button data-use="ops" aria-pressed="false">03 运维告警</button><button data-use="catalog" aria-pressed="false">04 商品与内容</button></div><div class="use-detail" id="useDetail"></div></div>`,notes:'这些例子具有共同特征：输入语义复杂，输出空间有限，判断可以通过标注数据或业务结果验证。客服分流可用于选择队列；RAG 场景可对候选段落相关性评分或检查引用；运维场景可判断告警是否值得升级；商品内容场景可做分类、匹配与排序。费用、时效、库存、权限等精确约束仍适合代码。初期适合影子运行，与人工结果比较后再逐步开放自动分流。'},
{title:'速度与成本：如何读官方数据',chapter:'证据与边界',refs:['launch','models','evals'],foot:'官方披露口径，核验于 2026-10-02；并非本演示实测',lead:'可以把数据当作候选方案的线索，再以自己的负载做端到端验证。',body:`<div class="metrics"><div class="metric"><div class="label">OFFICIAL LATENCY RANGE</div><div class="number accent" style="margin-top:21px">70–500<span class="unit"> ms</span></div><p>发布文章报告的端到端响应范围</p></div><div class="metric"><div class="label">LIST INPUT PRICE</div><div class="number accent" style="margin-top:21px">$0.042<span class="unit"> / 百万</span></div><p>输入 token 单价；当前输出免费</p></div></div><div class="metric-caveat"><div><h3>193.6× / 444.6× 的适用范围</h3><p>官网的速度与成本倍数来自四个指定工作流。官方承认，这可能处于实际收益的高端。</p></div><div><h3>比较条件会改变结果</h3><p>标签参考强模型的答案共识，非人工真值。测试地域、推理设置，以及是否要求完整概率都会影响对比。</p></div></div>`,notes:'官方发布文章给出的端到端延迟是 70 到 500 毫秒，测试通常从美国西岸发起。不要用本页区间推算中国网络或长输入的真实延迟。官网 193.6 倍更快、444.6 倍更便宜来自四个指定工作流，且使用强模型答案的平均值作为参照，不能当成所有实际任务的普适结论。更公平的验证应固定质量目标、状态长度、输出信息量、并发、区域、重试和缓存，再测 P50/P95 与单位成功任务成本。'},
{title:'交互实验：输入费用估算',chapter:'证据与边界',dark:true,refs:['models'],foot:'仅计算输入费用；对比单价为可调假设，不指代具体 LLM',lead:'调用量 × 每次输入 token 数 × 输入单价。把比较条件放到台面上。',body:`<div class="cost-layout"><div><div class="cost-input"><div class="slider-row"><label for="callsSlider">每月调用量</label><output id="callsValue" for="callsSlider"></output></div><input id="callsSlider" type="range" min="1" max="100" value="10"><div class="range-ends"><span>1 万</span><span>100 万</span></div></div><div class="cost-input"><div class="slider-row"><label for="tokensSlider">每次输入 tokens</label><output id="tokensValue" for="tokensSlider"></output></div><input id="tokensSlider" type="range" min="200" max="8000" value="1000" step="100"><div class="range-ends"><span>200</span><span>8,000</span></div></div><div class="cost-input"><div class="slider-row"><label for="priceSlider">假设对比输入价 / 百万</label><output id="priceValue" for="priceSlider"></output></div><input id="priceSlider" type="range" min="0.01" max="5" value="1" step="0.01"><div class="range-ends"><span>$0.01</span><span>$5.00</span></div></div></div><div class="cost-out"><div class="label">MONTHLY INPUT COST / USD</div><div class="price-row highlight"><span>Jev · $0.042 / 百万</span><strong id="jevCost"></strong></div><div class="price-row"><span>假设对比方案</span><strong id="llmCost"></strong></div><div class="price-row"><span>输入费用差额</span><strong id="costDifference"></strong></div><p class="cost-formula" id="costFormula"></p><p class="tiny" style="margin-top:16px">未计输出费、缓存、重试、托管、复核和集成成本。<br>也未假设两个方案具有相同准确率或相同总成本。</p></div></div>`,notes:'默认假设每月十万次调用、每次一千输入 tokens，总计一亿输入 tokens。按官方单价 Jev 输入成本为 4.20 美元；假设对比单价为每百万 1 美元，对应 100 美元。这个比较只涉及相同输入量下的输入账单，不包含结果质量或端到端收益。允许把对比价格调到比 Jev 更低，以免演示暗含“必然更便宜”。生产估算还应考虑问题文本计入输入、失败重试、人审和模型需要的不同上下文长度。'},
{title:'能力边界决定能否落地',chapter:'证据与边界',refs:['limits','intro'],foot:'依据当前 Jev 1.13 文档；后续模型版本可能变化',lead:'输出类型可控，语义判断仍然需要证据和评测。',body:`<div class="limit-grid"><div class="limit-item"><div class="num">01</div><div><h3>类型正确，仍可能选错</h3><p>只能从指定选项里回答，并不保证所选类别符合事实，也不保证概率在新领域仍然校准。</p></div></div><div class="limit-item"><div class="num">02</div><div><h3>精确计算留给代码</h3><p>金额合计、日期比较、账户权限等，使用确定性逻辑。官方列出数值与多跳判断的局限。</p></div></div><div class="limit-item"><div class="num">03</div><div><h3>问题与证据需要整理</h3><p>无关长上下文、复杂否定和对抗内容可能影响结果。相互依赖的判断应拆开组织。</p></div></div><div class="limit-item"><div class="num">04</div><div><h3>当前以文本状态为输入</h3><p>不直接读取图片、音频或视频。写作、代码生成与开放式规划仍交给合适的生成式模型。</p></div></div></div>`,notes:'此处区分 schema 保证与语义可靠性。一个选项可以百分之百符合 schema，却选错业务类别。Jev 1.13 官方文档列出精确数值、日期、多跳、双重否定、无关长上下文和对抗输入等不足。部署时需要建立含模糊、缺失和异常输入的验证集，记录覆盖率、错分率和代价，并设置回退。模型置信度不能替代授权、审计或事实核验。'},
{title:'把合适的工作，交给合适的组件',chapter:'收束',dark:true,refs:['patterns','routing'],foot:'实践起点：选择一个高频窄任务，先验证质量，再评估收益',body:`<div class="takeaway"><div><div class="label">ONE IDEA TO REMEMBER</div><div class="space"></div><div class="takeaway-title">让判断成为<br>软件里可组合的<br><span class="accent">一个步骤。</span></div><p class="lead" style="margin-top:28px">Jev 的位置，是应用中的决策组件。<br>它与 LLM、代码和人共同完成任务。</p></div><div><div class="role"><strong>Jev</strong><p>识别意图、选择候选、按标尺评分<br>把不确定性一起交给系统</p></div><div class="role"><strong>LLM</strong><p>写回复、生成代码、解释与规划<br>处理开放式表达</p></div><div class="role"><strong>代码</strong><p>精确计算、规则与权限检查<br>负责执行与失败处理</p></div><div class="role"><strong>人</strong><p>定义目标与容错边界<br>复核重要或不确定的情况</p></div></div></div>`,notes:'结束时回到软件设计：最小落地单位不是替换整个智能体，而是把一个重复、高频、边界清楚的判断抽出来。用历史样本测试，先做影子模式，再在能够承受错误的范围里引入自动分流。保留 LLM 的生成能力、代码的确定性与人的责任边界。这个组合是否优于原有系统，要以自己的成功率、延迟、成本与维护工作量衡量。'},
{title:'资料来源与演示说明',chapter:'参考',refs:[],foot:'核验日期：2026-10-02',lead:'以 TypeSafe 官方文档为主，区分产品描述、官方评测与教学模拟。',body:`<div class="source-list"><div class="source-item"><b>01</b><div>${sourceLink('intro')}<p>模型定位、输入输出契约与命名</p></div></div><div class="source-item"><b>02</b><div>${sourceLink('primitives')}<p>Choice / Noul / Score 与独立并行问题</p></div></div><div class="source-item"><b>03</b><div>${sourceLink('primer')}<p>RLCD 与概率校准的公开说明</p></div></div><div class="source-item"><b>04</b><div>${sourceLink('confidence')}<p>概率、confidence 公式与阈值策略</p></div></div><div class="source-item"><b>05</b><div>${sourceLink('launch')}<p>发布时的速度声明及比较条件</p></div></div><div class="source-item"><b>06</b><div>${sourceLink('evals')}<p>四个工作流与参考标签的构建方法</p></div></div><div class="source-item"><b>07</b><div>${sourceLink('models')}<p>当前模型规格与每百万输入 token 单价</p></div></div><div class="source-item"><b>08</b><div>${sourceLink('limits')}<p>类型保证之外的能力不足</p></div></div><div class="source-item"><b>09</b><div>${sourceLink('api')}<p>state / questions HTTP 请求契约</p></div></div><div class="source-item"><b>10</b><div>${sourceLink('structured')}<p>说明 LLM 也可通过约束解码获得结构化输出</p></div></div></div><p class="source-tail">本演示不调用 Jev 或 LLM API。工单、动画、分布与校准曲线均为教学模拟；成本工具按公开单价和可调假设计算。页底来源与“讲解”中附有对应依据。</p>`,notes:'离线播放不需要任何外部资源，只有点击文档链接时才会访问互联网。讲解备注为每页提供了口径与上下文。公开资料核验时间是 2026 年 10 月 2 日，后续价格、版本、能力与 API 可能变化。演示没有使用实测 API 结果，不应被当作模型性能测评。'}
];
const stage=document.getElementById('stage');
slides.forEach((s,i)=>{const section=document.createElement('section');section.className=`slide${s.dark?' dark':''}`;section.id=`slide-${i+1}`;section.setAttribute('aria-label',`${i+1}. ${s.title}`);section.innerHTML=(i===0?'':`<div class="eyebrow">${String(i+1).padStart(2,'0')} / ${s.chapter}</div><h2>${s.title}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}`)+`<div class="content">${s.body}</div><div class="foot"><span>${s.foot||''}</span><span>${s.refs.slice(0,2).map(sourceLink).join('　')}</span></div>`;stage.append(section)});
const $=id=>document.getElementById(id);
let current=0,raceTimers=[],flowIndex=0;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function fit(){if(innerWidth<=700){stage.style.transform='none';return}const scale=Math.min((innerWidth-30)/1440,(innerHeight-95)/810);stage.style.transform=`scale(${Math.max(.1,scale)})`}
function cancelRace(){raceTimers.forEach(clearTimeout);raceTimers=[]}
function showSlide(index,updateHash=true){cancelRace();current=Math.max(0,Math.min(slides.length-1,index));document.querySelectorAll('.slide').forEach((el,i)=>{const active=i===current;el.classList.toggle('active',active);el.inert=!active;el.setAttribute('aria-hidden',String(!active))});$('pageCount').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;$('chapter').textContent=slides[current].chapter;$('progress').style.width=`${((current+1)/slides.length)*100}%`;$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('announce').textContent=`第 ${current+1} 页，共 ${slides.length} 页。${slides[current].title}`;if(updateHash)history.replaceState(null,'',`#slide-${current+1}`);if(innerWidth<=700)window.scrollTo({top:0,behavior:'instant'});fit()}
function showDialog(id){const dlg=$(id);if(dlg.open){dlg.close();return}document.querySelectorAll('dialog[open]').forEach(d=>d.close());if(id==='overview'){dlg.querySelector('.overview-grid').innerHTML=slides.map((s,i)=>`<button class="${i===current?'current':''}" data-go="${i}" ${i===current?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')} / ${s.chapter}</span>${s.title}</button>`).join('')}if(id==='notes'){$('notes').querySelector('h2').textContent=`${String(current+1).padStart(2,'0')} · ${slides[current].title}`;$('notes').querySelector('.notes-text').textContent=slides[current].notes;$('notes').querySelector('.notes-sources').innerHTML='对应资料：'+(slides[current].refs.map(sourceLink).join('　')||'见本页文档链接')}dlg.showModal()}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}else{showDialog('help')}}catch{showDialog('help')}}
$('prev').onclick=()=>showSlide(current-1);$('next').onclick=()=>showSlide(current+1);$('overviewButton').onclick=()=>showDialog('overview');$('notesButton').onclick=()=>showDialog('notes');$('helpButton').onclick=()=>showDialog('help');$('fullscreenButton').onclick=fullscreen;$('printButton').onclick=()=>window.print();
document.addEventListener('fullscreenchange',()=>{$('fullscreenButton').textContent=document.fullscreenElement?'退出全屏':'全屏';fit()});
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){document.querySelectorAll('dialog[open]').forEach(d=>d.close());showSlide(Number(go.dataset.go))}if(e.target.closest('.close'))e.target.closest('dialog').close()});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('input,textarea,select')||document.querySelector('dialog[open]'))return;if((e.key===' '||e.key==='Enter')&&e.target.closest('button,a'))return;const key=e.key.toLowerCase();if(['arrowright','pagedown',' '].includes(key)){e.preventDefault();showSlide(current+1)}else if(['arrowleft','pageup'].includes(key)){e.preventDefault();showSlide(current-1)}else if(key==='home'){e.preventDefault();showSlide(0)}else if(key==='end'){e.preventDefault();showSlide(slides.length-1)}else if(key==='o')showDialog('overview');else if(key==='n')showDialog('notes');else if(key==='f')fullscreen();else if(key==='?')showDialog('help')});
let touchStart=null;stage.addEventListener('touchstart',e=>{if(e.target.closest('input,button,a'))return;touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});stage.addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6)showSlide(current+(dx<0?1:-1));touchStart=null},{passive:true});window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const match=location.hash.match(/^#slide-(\d+)$/);if(match)showSlide(Number(match[1])-1,false)});
function bars(labels,values){return labels.map((l,i)=>`<div class="bar-row"><span>${l}</span><div class="bar-track" role="img" aria-label="${l} ${Math.round(values[i]*100)}%"><div class="bar-fill" style="width:${values[i]*100}%"></div></div><span class="bar-value">${values[i].toFixed(2)}</span></div>`).join('')}
function selectButton(group,attribute,value){group.querySelectorAll('button').forEach(b=>{const selected=b.dataset[attribute]===value;b.classList.toggle('active',selected);b.setAttribute('aria-pressed',String(selected))})}
const primitiveData={choice:{kind:'从预定义选项里选一个',question:'应交给哪个团队？',value:'billing',explanation:'返回选项、各选项的概率与 confidence。<br>分类清楚，软件便能选择对应处理分支。',labels:['账单','技术','账户'],values:[.9,.07,.03],code:'choice: "billing"\nconfidence: 0.85'},noul:{kind:'是非问题的概率',question:'是否表达了退款诉求？',value:'0.96<em>P(yes)</em>',explanation:'返回一个 0 到 1 的数值。<br>接近 0.5 表示不确定，不是“程度中等”。',labels:['Yes','No'],values:[.96,.04],code:'noul: 0.96\n// 不含单独的 confidence 字段'},score:{kind:'有序标尺上的评分',question:'客户有多不满？',value:'1.20<em>/ 2</em>',explanation:'0 = 平静，1 = 不满，2 = 强烈愤怒。<br>分数是等级的概率加权位置，可以是小数。',labels:['0 平静','1 不满','2 强烈愤怒'],values:[.05,.7,.25],code:'score: 1.20\n0×0.05 + 1×0.70 + 2×0.25'}};
function renderPrimitive(type){const d=primitiveData[type];selectButton($('primitiveTabs'),'primitive',type);$('primitiveKind').textContent=d.kind;$('primitiveQuestion').textContent=d.question;$('primitiveValue').innerHTML=d.value;$('primitiveExplanation').innerHTML=d.explanation;$('primitiveBars').innerHTML=bars(d.labels,d.values);$('primitiveCode').textContent=d.code}
$('primitiveTabs').onclick=e=>{const b=e.target.closest('[data-primitive]');if(b)renderPrimitive(b.dataset.primitive)};renderPrimitive('choice');
const tokens=['{','\n  "team"',': ','"billing"',',','\n  "refund_request"',': ','true',',','\n  "reply"',': ','"我','会','帮','您','核','查','。"','\n}'];
function finishRace(){ $('tokenOutput').textContent=tokens.join('');$('tokenProgress').style.width='100%';$('parallelOutput').classList.add('ready');$('parallelProgress').style.width='100%';$('tokenStatus').textContent='文本生成完成';$('parallelStatus').textContent='三个独立结果已返回'}
function startRace(){cancelRace();$('tokenOutput').textContent='';$('tokenProgress').style.width='0%';$('parallelOutput').classList.remove('ready');$('parallelProgress').style.width='0%';$('tokenStatus').textContent='依次生成 token…';$('parallelStatus').textContent='读取状态，独立判断…';if(reducedMotion.matches){finishRace();return}tokens.forEach((token,i)=>raceTimers.push(setTimeout(()=>{$('tokenOutput').textContent+=token;$('tokenProgress').style.width=`${(i+1)/tokens.length*100}%`;if(i===tokens.length-1)$('tokenStatus').textContent='文本生成完成'},200+i*155)));raceTimers.push(setTimeout(()=>{$('parallelOutput').classList.add('ready');$('parallelProgress').style.width='100%';$('parallelStatus').textContent='三个独立结果已返回'},800))}
$('replayRace').onclick=startRace;finishRace();
function renderCal(mode){selectButton($('calTabs'),'cal',mode);const predicted=[20,40,60,80,100],observed=mode==='good'?[20,40,60,80,100]:[12,22,37,50,68];$('calChart').innerHTML=predicted.map((p,i)=>`<div class="chart-group" role="img" aria-label="预测概率 ${p}%，实际比例 ${observed[i]}%"><div class="chart-bar" style="--h:${p}%"></div><div class="chart-bar actual" style="--h:${observed[i]}%"></div><label>${p}%</label></div>`).join('');$('calSummary').innerHTML=mode==='good'?'报告 <strong>80%</strong> 的一组，约 <strong>80%</strong> 发生':'报告 <strong>80%</strong> 的一组，只有 <strong>50%</strong> 发生'}
$('calTabs').onclick=e=>{const b=e.target.closest('[data-cal]');if(b)renderCal(b.dataset.cal)};renderCal('good');
function choiceConfidence(values){const n=values.length;return Math.max(0,(Math.max(...values)-1/n)/(1-1/n))}
function renderConfidence(){const p=Number($('probSlider').value)/100,values=[p,(1-p)/2,(1-p)/2];$('probValue').textContent=p.toFixed(2);$('confidenceBars').innerHTML=bars(['账单','技术','账户'],values);$('confidenceValue').textContent=choiceConfidence(values).toFixed(2)}
$('probSlider').oninput=renderConfidence;renderConfidence();
const tickets={clear:{message:'“同一个订单扣了两次款，请尽快帮我处理。”',values:[.9,.07,.03],choice:'billing',route:'转账单队列'},ambiguous:{message:'“我的账户出了点问题，付款之后好像就不能用了。”',values:[.35,.25,.4],choice:'account',route:'转账户队列'},technical:{message:'“导出的 CSV 每次都变成乱码，换了浏览器还是一样。”',values:[.03,.94,.03],choice:'technical',route:'转技术队列'}};let selectedTicket='clear';
function renderTicket(){const d=tickets[selectedTicket],confidence=choiceConfidence(d.values),threshold=Number($('thresholdSlider').value)/100,auto=confidence+1e-9>=threshold;selectButton($('ticketTabs'),'ticket',selectedTicket);$('ticketMessage').textContent=d.message;$('ticketBars').innerHTML=bars(['账单','技术','账户'],d.values);$('ticketConfidence').textContent=confidence.toFixed(2);$('thresholdValue').textContent=threshold.toFixed(2);$('routeResult').classList.toggle('review',!auto);$('routeText').textContent=auto?d.route:'转人工复核';$('routeCondition').textContent=`${confidence.toFixed(2)} ${auto?'≥':'<'} ${threshold.toFixed(2)}`}
$('ticketTabs').onclick=e=>{const b=e.target.closest('[data-ticket]');if(b){selectedTicket=b.dataset.ticket;renderTicket()}};$('thresholdSlider').oninput=renderTicket;renderTicket();
const flowText=['Jev 读懂退款诉求，给出“账单”方向的判断。','代码查询订单、核对交易事实，并检查业务规则。','LLM 根据已核实信息生成回复草稿。','Jev 检查草稿与证据的关系；代码按规则决定流转或复核。'];function renderFlow(){document.querySelectorAll('[data-flow-step]').forEach((el,i)=>el.classList.toggle('on',i<=flowIndex));$('flowStatus').textContent=flowText[flowIndex];$('flowNext').textContent=flowIndex===3?'重新播放 ↻':'播放下一步 →'}$('flowNext').onclick=()=>{flowIndex=(flowIndex+1)%4;renderFlow()};$('flowReset').onclick=()=>{flowIndex=0;renderFlow()};renderFlow();
const useCases={support:{title:'把请求送到正确队列',state:'输入：用户消息、账户状态、已有处理记录。',question:'选择业务类别，判断是否需要补充信息或升级。',code:'查询精确事实，检查权限，再路由给团队、LLM 或人工。',boundary:'模型识别退款诉求，不等于批准退款。'},rag:{title:'为回答筛选更有用的证据',state:'输入：查询问题、检索候选段落、待核验的引用。',question:'给相关性评分，或判断候选段落是否支持指定说法。',code:'召回文档、排序截断、保留出处，让 LLM 写有依据的回答。',boundary:'相关性判断会出错，不能把检查结果当成事实证明。'},ops:{title:'让值得检查的告警先到达',state:'输入：日志摘要、相关事件、设备或服务状态。',question:'判断异常类别与严重程度，建议升级到哪个响应队列。',code:'保留原始日志，执行确定性检测与升级规则。',boundary:'模型排序不应自动删除原始记录，也不直接授予隔离权限。'},catalog:{title:'在已有候选中匹配与排序',state:'输入：需求描述、商品或内容候选、清晰的分类标尺。',question:'选择合适候选、给匹配程度评分、标注内容类别。',code:'先过滤库存、预算与权限，必要时由 LLM 生成介绍。',boundary:'从已有候选里选，匹配结果仍需验证具体属性。'}};
function renderUse(type){selectButton(document.querySelector('.use-nav'),'use',type);const d=useCases[type];$('useDetail').innerHTML=`<h3>${d.title}</h3><p class="use-state">${d.state}</p><div class="use-step-grid"><div class="rule"><h4>JEV 的窄判断</h4><p>${d.question}</p></div><div class="rule"><h4>系统负责的部分</h4><p>${d.code}</p></div></div><p class="callout" style="margin-top:29px">${d.boundary}</p>`}document.querySelector('.use-nav').onclick=e=>{const b=e.target.closest('[data-use]');if(b)renderUse(b.dataset.use)};renderUse('support');
const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2});function renderCost(){const calls=Number($('callsSlider').value)*10000,tokensCount=Number($('tokensSlider').value),price=Number($('priceSlider').value),millions=calls*tokensCount/1e6,jev=millions*.042,llm=millions*price;$('callsValue').textContent=`${calls/10000} 万`;$('tokensValue').textContent=tokensCount.toLocaleString('en-US');$('priceValue').textContent=money(price);$('jevCost').textContent=money(jev);$('llmCost').textContent=money(llm);$('costDifference').textContent=money(llm-jev);$('costFormula').textContent=`${calls.toLocaleString('en-US')} 次 × ${tokensCount.toLocaleString('en-US')} tokens = ${millions.toLocaleString('en-US')} 百万输入 tokens`}['callsSlider','tokensSlider','priceSlider'].forEach(id=>$(id).oninput=renderCost);renderCost();
const initialMatch=location.hash.match(/^#slide-(\d+)$/);showSlide(initialMatch?Number(initialMatch[1])-1:0,false);
window.addEventListener('beforeprint',()=>{cancelRace();finishRace();document.querySelectorAll('.slide').forEach(el=>{el.inert=false;el.setAttribute('aria-hidden','false')})});window.addEventListener('afterprint',()=>showSlide(current,false));
</script>
